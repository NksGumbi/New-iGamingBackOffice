<mat-toolbar class="topbar">
  <button mat-icon-button (click)="toggleSidenav.emit()" class="menu-toggle">
    <mat-icon>menu</mat-icon>
  </button>

  <div class="topbar-title">
    <span class="platform-name">iGaming Integration Back Office</span>
  </div>

  <span class="flex-spacer"></span>

  <div class="topbar-actions">
    <button mat-icon-button [matMenuTriggerFor]="notificationsMenu">
      <mat-icon>notifications</mat-icon>
    </button>

    <mat-menu #notificationsMenu="matMenu">
      <div class="notification-header">Notifications</div>
      <button mat-menu-item>
        <mat-icon>info</mat-icon>
        <span>New operator registered</span>
      </button>
      <button mat-menu-item>
        <mat-icon>warning</mat-icon>
        <span>API key expiring soon</span>
      </button>
    </mat-menu>

    <button mat-button [matMenuTriggerFor]="userMenu" class="user-button">
      <div class="user-avatar">{{ userInitials }}</div>
      <span class="user-name">{{ userFullName }}</span>
      <mat-icon>arrow_drop_down</mat-icon>
    </button>

    <mat-menu #userMenu="matMenu">
      <button mat-menu-item>
        <mat-icon>account_circle</mat-icon>
        <span>Profile</span>
      </button>
      <button mat-menu-item>
        <mat-icon>settings</mat-icon>
        <span>Settings</span>
      </button>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Logout</span>
      </button>
    </mat-menu>
  </div>
</mat-toolbar>
